<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Base64 Tool — encode &amp; decode</title>
<!-- all the page styling lives in styles.css -->
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <!-- the top title area -->
  <header>
    <h1><span>⌁</span> Base64 Tool</h1>
    <p>Encode &amp; decode, UTF-8 safe — even emoji. 🌍</p>
  </header>
  <!-- the main card: input box, output box, buttons, options -->
  <div class="card">
    <label for="in">Input</label>
    <textarea id="in" spellcheck="false" placeholder="Type text to encode, or paste base64 to decode…"></textarea>
    <label for="out">Output</label>
    <textarea id="out" spellcheck="false" readonly placeholder="Result appears here…"></textarea>
    <!-- the Encode / Decode / Copy buttons -->
    <div class="row">
      <button id="encBtn" type="button">Encode →</button>
      <button id="decBtn" type="button">← Decode</button>
      <button id="copyBtn" type="button">Copy</button>
    </div>
    <!-- the URL-safe alphabet checkbox -->
    <label class="toggle"><input type="checkbox" id="urlSafe"> URL-safe alphabet <span style="font-size:.78rem;">(<code>-_</code> instead of <code>+/</code>, no padding)</span></label>
    <!-- the message line: shows success or error text -->
    <div id="msg"></div>
  </div>
  <!-- the small note at the bottom of the page -->
  <p class="hint">Runs entirely in your browser. Invalid base64 is rejected with a clear error.</p>
</div>
<!-- all the page logic lives in app.js -->
<script src="app.js"></script>
</body>
</html>
